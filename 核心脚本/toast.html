<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>toast</title>
<style>
  @keyframes liquidSpin { to { transform: rotate(360deg); } }
  @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; cursor: default;
      font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  html, body { background: transparent; overflow: hidden; }

  /* 核心弹窗卡片（背景/遮罩/调试按钮已剥离） */
  .stage { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 420px;
           animation: island .45s cubic-bezier(.175,.885,.32,1.275) both; }
  @keyframes island { from { transform: translate(-50%,-50%) scale(.88); opacity: 0; }
                      to   { transform: translate(-50%,-50%) scale(1);   opacity: 1; } }
  html.closing .stage { transition: all .42s cubic-bezier(.4,0,1,1);
                        transform: translate(-50%,-50%) scale(.9); opacity: 0; }

  .frame { position: relative; padding: 1.5px; border-radius: 32px; overflow: hidden;
           box-shadow: 0 30px 70px rgba(0,0,0,.55); }
  .spin { position: absolute; inset: -150%; pointer-events: none;
          background: conic-gradient(from 0deg, #38bdf8, #818cf8, #c084fc, #f472b6, #38bdf8);
          animation: liquidSpin 8s linear infinite; }
  .spin.a { opacity: .6; }
  .spin.b { opacity: .35; filter: blur(12px); }

  .card { position: relative; border-radius: 30.5px; padding: 24px; color: #fff; overflow: hidden;
          backdrop-filter: blur(32px) saturate(190%); -webkit-backdrop-filter: blur(32px) saturate(190%);
          background: radial-gradient(120% 120% at 50% 0%, rgba(255,255,255,.15) 0%, rgba(255,255,255,.03) 60%, rgba(13,14,22,.78) 100%);
          box-shadow: inset 0 1px 1.5px 0 rgba(255,255,255,.35), inset 0 -1px 1px 0 rgba(255,255,255,.05); }

  .head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 14px;
          border-bottom: 1px solid rgba(255,255,255,.1); }
  .brand { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22d3ee;
         box-shadow: 0 0 8px #38bdf8; animation: pulseDot 2s ease-in-out infinite; }
  .cap { font-size: 11px; letter-spacing: .05em; text-transform: uppercase;
         font-weight: 600; color: rgba(255,255,255,.5); }
  .xbtn { width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.05);
          border: 1px solid rgba(255,255,255,.1); color: rgba(255,255,255,.5); font-size: 12px;
          display: flex; align-items: center; justify-content: center; transition: all .2s; }
  .xbtn:hover { background: rgba(255,255,255,.15); color: #fff; }
  .xbtn:active { transform: scale(.9); }

  .title { margin-top: 16px; font-size: 18px; font-weight: 500; letter-spacing: -.01em;
           color: rgba(255,255,255,.95); }
  .rows { margin-top: 6px; display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 300;
         color: rgba(255,255,255,.6); }
  .led { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .led.ok   { background: #3ddc84; box-shadow: 0 0 8px rgba(61,220,132,.75); }
  .led.skip { background: #7dd3fc; box-shadow: 0 0 8px rgba(125,211,252,.65); }
  /* ★ warn = 待复核（服务端限流 / profile 被占用）：本轮没确认签到，但也不是
     失败 —— 用琥珀色区别于 fail 的红灯，避免用户以为白签了（2026-09-19）。 */
  .led.warn { background: #fbbf24; box-shadow: 0 0 8px rgba(251,191,36,.7); }
  .led.fail { background: #ff6b6b; box-shadow: 0 0 8px rgba(255,107,107,.75); }
  .tag { font-size: 9px; font-weight: 700; letter-spacing: .08em; padding: 3px 8px;
         border-radius: 8px; color: rgba(255,255,255,.6);
         background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); }
  .name { color: rgba(255,255,255,.85); }
  .note { margin-left: auto; color: rgba(255,255,255,.45); font-size: 11px; }

  .foot { margin-top: 20px; display: flex; align-items: center; justify-content: space-between; }
  .timeinfo { font-size: 10px; letter-spacing: .1em; color: rgba(255,255,255,.35); }
  .btns { display: flex; gap: 10px; }
  .btn { border: none; border-radius: 12px; font-size: 12px; font-weight: 500; padding: 6px 14px;
         transition: all .2s; }
  .btn.primary { padding: 6px 16px; }
  .btn.ghost { background: transparent; color: rgba(255,255,255,.6); }
  .btn.ghost:hover { color: #fff; background: rgba(255,255,255,.05); }
  .btn.primary { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
                 color: #fff; box-shadow: inset 0 1px 1px rgba(255,255,255,.4); }
  .btn.primary:hover { background: rgba(255,255,255,.25); }
  .btn.primary:active { transform: scale(.95); }
</style>
</head>
<body>
  <div class="stage">
    <div class="frame">
      <div class="spin a"></div>
      <div class="spin b"></div>
      <div class="card">
        <div class="head">
          <div class="brand"><div class="dot"></div><span class="cap">Dynamic Island</span></div>
          <div class="xbtn" onclick="doClose()">✕</div>
        </div>
        <h3 class="title" id="title"></h3>
        <div class="rows" id="rows"></div>
        <div class="foot">
          <span class="timeinfo" id="timeinfo"></span>
          <div class="btns">
            <button class="btn ghost" onclick="doClose()">取消</button>
            <button class="btn primary" onclick="doClose()">确认</button>
          </div>
        </div>
      </div>
    </div>
  </div>
<script>
  const P = window.__PAYLOAD__ || { title: "", rows: [], time: "" };
  document.getElementById("title").textContent = P.title || "";
  const rowsEl = document.getElementById("rows");
  (P.rows || []).forEach(r => {
    const div = document.createElement("div");
    div.className = "row";
    div.innerHTML = '<div class="led ' + r.state + '"></div>' +
                    '<div class="tag">' + r.tag + '</div>' +
                    '<div class="name"></div>' +
                    (r.note ? '<div class="note"></div>' : '');
    div.querySelector(".name").textContent = r.name;
    if (r.note) div.querySelector(".note").textContent = r.note;
    rowsEl.appendChild(div);
  });
  document.getElementById("timeinfo").textContent = P.time || "";

  let closed = false;
  function doClose() {
    if (closed) return;
    closed = true;
    document.documentElement.classList.add("closing");
    setTimeout(() => { try { pywebview.api.close(); } catch (e) {} }, 430);
  }
  // ★ 自动关闭 12s（原 6.5s）：6.5s 太短 —— 2026-09-19 用户"走神"就完全没看到
  //   第二次「补跑完成」弹窗。与宿主 toast_gui.py 的 12000ms 兜底保持一致。
  setTimeout(doClose, 12000);
</script>
</body>
</html>
